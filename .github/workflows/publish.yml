name: Build Dendron Static Site

on:
  push:
    branches:
    - main 

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Restore Node modules cache
      uses: actions/cache@v4
      id: node-modules-cache
      with:
        path: |
          node_modules
          .next/*
          !.next/.next/cache
          !.next/.env.*
        key: ${{ runner.os }}-dendronv2-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}

    - name: Install dependencies
      run: yarn

    - name: Print version
      run: yarn dendron-cli -- --version
      
    - name: Restore Next cache
      uses: actions/cache@v4
      with:
        path: .next/.next/cache
        # Generate a new cache whenever packages or source files change.
        key: ${{ runner.os }}-nextjs-${{ hashFiles('.next/yarn.lock', '.next/package-lock.json') }}-${{ hashFiles('.next/**.[jt]s', '.next/**.[jt]sx') }}

    - name: Initialize or pull nextjs template
      run: "(test -d .next) && (echo 'updating dendron next...' && cd .next && git reset --hard && git clean -f && git pull && yarn && cd ..) || (echo 'init dendron next' && yarn dendron publish init)"

    - name: Apply template overrides (anchor links, scrollable tables)
      run: |
        cat >> .next/styles/scss/content.scss <<'EOF'
        // SHKO override: deep-linkable headings. The Dendron template renders
        // an <a.anchor-heading href="#id"> on every heading, but its icon is a
        // broken svg sprite (#svg-link is not shipped) — so we hide the svg and
        // draw our own "#" glyph. Kept hidden by default (touch devices can't
        // hover, and an always-present gutter element could cause horizontal
        // scroll); shown only on real-pointer devices, where the template
        // already fades it in when the heading is hovered.
        .main-content .anchor-heading {
          display: none !important;
        }
        // Deep links must not land underneath the fixed 64px site header.
        .main-content h1,
        .main-content h2,
        .main-content h3,
        .main-content h4,
        .main-content h5,
        .main-content h6 {
          scroll-margin-top: 80px;
        }
        @media (hover: hover) and (pointer: fine) {
          .main-content h1,
          .main-content h2,
          .main-content h3,
          .main-content h4,
          .main-content h5,
          .main-content h6 {
            position: relative;
          }
          .main-content .anchor-heading {
            display: inline-block !important;
            position: absolute;
            right: 100%;
            top: 0;
            margin-right: 0.2em;
            line-height: inherit;
            text-decoration: none;
            white-space: nowrap;
          }
          .main-content .anchor-heading svg {
            display: none;
          }
          .main-content .anchor-heading::before {
            content: "#";
            font-weight: 400;
          }
          .main-content .anchor-heading:hover {
            color: #1890ff;
          }
        }
        // SHKO override: wide markdown tables scroll inside themselves on
        // mobile instead of pushing the whole page sideways (the template's
        // .table-responsive wrapper is never applied to markdown tables).
        .main-content table {
          display: block;
          max-width: 100%;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        EOF
    - name: Apply template overrides (expand sidebar tree, comments box)
      run: |
        cp "$GITHUB_WORKSPACE/scripts/overrides/DendronTreeMenu.tsx" .next/components/DendronTreeMenu.tsx
        cp "$GITHUB_WORKSPACE/scripts/overrides/DendronNoteGiscusWidget.tsx" .next/components/DendronNoteGiscusWidget.tsx

    - name: Export notes
      run: yarn dendron publish export --target github --yes
      
    - name: Auto-expand sidebar (post-export patch)
      run: yarn run patch:sidebar

    # SHKO fix: Dendron publishes the root/index note only as docs/index.html
    # (served at "/"), but the auto-generated Backlinks on every page it links
    # to point at /notes/<root-id>, which is never emitted and 404s. Emit a
    # redirect there so that backlink lands on the home page.
    - name: Fix root backlink (redirect /notes/<root-id> to home)
      run: |
        mkdir -p docs/notes/pfy4h1nwep9age7eg0u8xe1
        cat > docs/notes/pfy4h1nwep9age7eg0u8xe1/index.html <<'EOF'
        <!DOCTYPE html>
        <html lang="en"><head><meta charset="utf-8">
        <title>SHKO (Save Hong Kong Online)</title>
        <link rel="canonical" href="https://savehkonline.org/">
        <meta http-equiv="refresh" content="0; url=/">
        <script>location.replace('/')</script>
        </head><body>Redirecting to the <a href="/">SHKO home page</a>…</body></html>
        EOF

    - name: Deploy site
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: pages
        publish_dir: docs/
        force_orphan: true
        cname: savehkonline.org
